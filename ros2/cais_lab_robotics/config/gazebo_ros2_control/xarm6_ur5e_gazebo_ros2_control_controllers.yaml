# Combined controller config for xArm6 + UR5e dual-robot Gazebo Classic simulation.
# Both robots share a single gazebo_ros2_control plugin and controller_manager.

controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz
    use_sim_time: true

    # Shared joint state broadcaster (publishes all joints from both robots)
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # xArm6 arm trajectory controller
    xarm6_xarm6_traj_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # xArm6 gripper trajectory controller
    xarm6_xarm_gripper_traj_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # UR5e arm trajectory controller
    ur5e_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # UR5e RG2 gripper trajectory controller
    ur5e_rg2_gripper_traj_controller:
      type: joint_trajectory_controller/JointTrajectoryController

# -- xArm6 arm --
xarm6_xarm6_traj_controller:
  ros__parameters:
    joints:
      - xarm6_joint1
      - xarm6_joint2
      - xarm6_joint3
      - xarm6_joint4
      - xarm6_joint5
      - xarm6_joint6
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity
    interface_name: position
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    open_loop_control: true
    constraints:
      goal_time: 0.5
      stopped_velocity_tolerance: 0.0
      xarm6_joint1: {trajectory: 1.0, goal: 0.01}
      xarm6_joint2: {trajectory: 1.0, goal: 0.01}
      xarm6_joint3: {trajectory: 1.0, goal: 0.01}
      xarm6_joint4: {trajectory: 1.0, goal: 0.01}
      xarm6_joint5: {trajectory: 1.0, goal: 0.01}
      xarm6_joint6: {trajectory: 1.0, goal: 0.01}

# -- xArm6 gripper --
xarm6_xarm_gripper_traj_controller:
  ros__parameters:
    joints:
      - xarm6_drive_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    interface_name: position

# -- UR5e arm --
ur5e_joint_trajectory_controller:
  ros__parameters:
    joints:
      - ur5e_shoulder_pan_joint
      - ur5e_shoulder_lift_joint
      - ur5e_elbow_joint
      - ur5e_wrist_1_joint
      - ur5e_wrist_2_joint
      - ur5e_wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 0.0

# -- UR5e RG2 gripper --
ur5e_rg2_gripper_traj_controller:
  ros__parameters:
    joints:
      - ur5e_rg2_finger_width
    command_interfaces:
      - position
    state_interfaces:
      - position
    interface_name: position
