xarm6:
  robot_ip: "192.168.1.240"
  moveit:
    launch: "xarm6_hardware_moveit.launch.py"
    robot_type: "xarm"
    dof: 6
    hw_ns: "xarm"
    add_gripper: true
    default_velocity_scaling: 0.65
    default_acceleration_scaling: 0.65
    arm_joint_limits:
      max_velocity: 1.391
      max_acceleration: 6.5
    gripper_joint_limits:
      max_velocity: 3.14
      max_acceleration: 10.0
  joint_state_topics:
    - "/joint_states"
    - "/xarm/joint_states"
    - "/xarm6/joint_states"
    - "/xarm6/xarm/joint_states"
    - "/xarm6/xarm_gripper/joint_states"
  trajectory_topics:
    - "/xarm6/xarm6_traj_controller/joint_trajectory"
    - "/xarm6_traj_controller/joint_trajectory"
    - "/xarm_traj_controller/joint_trajectory"
    - "/xarm6_xarm6_traj_controller/joint_trajectory"
  hardware_trajectory_action: "/xarm6/xarm6_traj_controller/follow_joint_trajectory"
  hardware_cartesian_service: "/xarm6/xarm/set_position"
  hardware_cartesian_velocity_service: "/xarm6/xarm/vc_set_cartesian_velocity"
  hardware_robot_states_topic: "/xarm6/xarm/robot_states"
  cartesian:
    speed_mm_s: 50.0
    max_speed_mm_s: 100.0
    acceleration_mm_s2: 42.25
    position_tolerance_m: 0.003
    orientation_tolerance_rad: 0.0523598776
  gazebo_trajectory_topics:
    - "/xarm6_xarm6_traj_controller/joint_trajectory"
    - "/xarm6_traj_controller/joint_trajectory"
  gripper:
    joint: "xarm6_drive_joint"
    hardware_service: "set_gripper_position"
    hardware_action: "/xarm6/xarm_gripper/gripper_action"
    gazebo_trajectory_topics:
      - "/xarm6_xarm_gripper_traj_controller/joint_trajectory"
    open_position: 0.0
    close_position: 0.85
    open_pulse: 850.0
    close_pulse: 0.0

ur5e:
  robot_ip: "192.168.1.172"
  moveit:
    launch: "ur5e_rg2_hardware_moveit.launch.py"
    group_name: "ur_manipulator"
    default_velocity_scaling: 0.50
    default_acceleration_scaling: 0.50
    arm_joint_limits:
      max_velocity: 2.90
      max_acceleration: 4.80
    gripper_joint_limits:
      max_velocity: 0.40
      max_acceleration: 1.50
    rtde_allowed_execution_duration_scaling: 8.0
    rtde_allowed_goal_duration_margin: 20.0
    rtde_trajectory_controller: "cais_ur5e_rtde_trajectory_controller"
  cartesian:
    speed_mm_s: 100.0
  rtde:
    # The server consumes feedback at 50 Hz. A 125 Hz RTDE session leaves
    # sampling headroom without running two 500 Hz native clients in WSL.
    frequency_hz: 125.0
    max_joint_vel_rad_s: 1.324
    max_joint_accel_rad_s2: 1.486
    max_joint_jerk_rad_s3: 3.025
    joint_goal_tolerance_rad: 0.025
    shoulder_pan_extra_scale: 2.0
    movej_speed_rad_s: 1.486
    movej_accel_rad_s2: 1.81
    control_program_start_timeout_sec: 2.0
    motion_start_timeout_sec: 2.0
    motion_start_delta_rad: 0.001
    feedback_reconnect_after_sec: 0.5
    feedback_reconnect_retry_sec: 1.0
    feedback_recovery_timeout_sec: 2.0
    stationary_hold_sec: 0.10
    stopped_away_hold_sec: 0.5
    cartesian_speed_m_s: 0.15
    cartesian_max_speed_m_s: 0.15
    cartesian_accel_m_s2: 0.20
    cartesian_position_tolerance_m: 0.002
    cartesian_orientation_tolerance_rad: 0.0349065850
    # Effective configured lab geometry for TF world -> base, not the launch
    # world -> base_link mount.
    cartesian_world_base:
      x_m: 0.0
      y_m: 0.5
      z_m: 1.021
      roll_rad: 0.0
      pitch_rad: 0.0
      yaw_rad: 0.0
    insert_demonstration_max_duration_sec: 300.0
    insert_demonstration_baseline_sec: 1.0
    insert_demonstration_stationary_speed_m_s: 0.001
    insert_demonstration_stationary_angular_speed_rad_s: 0.02
    # Protected absolute ceilings for learned insertion recipes. The recorded
    # successful envelope can only lower these values; Control exposes none of
    # them as operator inputs.
    insert_max_contact_speed_m_s: 0.005
    insert_max_contact_force_delta_n: 12.0
    insert_max_engagement_progress_m: 0.02
    insert_max_insertion_force_n: 15.0
    insert_max_spiral_radius_m: 0.002
    insert_max_spiral_pitch_m: 0.001
    insert_max_spiral_speed_m_s: 0.004
    insert_max_spiral_acceleration_m_s2: 0.03
    insert_max_axial_force_n: 25.0
    insert_max_lateral_force_n: 12.0
    insert_max_torque_nm: 1.5
    # Exact provisional MG commissioning ceilings. These authorize only the
    # supervised one-confirmation workflow until its durable qualification is
    # complete; Control exposes no numeric editor for these protected values.
    MG:
      insert_max_insertion_force_n: 120.0
      insert_max_axial_force_n: 150.0
      insert_max_lateral_force_n: 55.0
      insert_max_torque_nm: 2.9
      insert_max_tool_flange_torque_nm: 7.8
      insert_max_relief_retreat_m: 0.0006
      insert_max_contact_search_radius_m: 0.010
      insert_max_disengagement_cycles: 6
      insert_search_peck_retreat_m: 0.003
      insert_search_peck_interval_sec: 0.75
    # Protected recoverable-overload commissioning profile. Control exposes
    # none of these values as operator inputs, and exact-part learned soft
    # thresholds must remain strictly below the absolute ceilings above.
    insert_max_tool_flange_torque_nm: 3.0
    insert_soft_filter_window_sec: 0.05
    insert_soft_overload_hold_sec: 0.10
    insert_relief_unload_dwell_sec: 0.10
    insert_relief_clear_dwell_sec: 0.10
    insert_relief_clear_hysteresis_ratio: 0.80
    insert_relief_timeout_sec: 1.0
    insert_relief_axial_force_ratio: 0.50
    insert_relief_reverse_force_ratio: 0.25
    insert_relief_resume_ramp_sec: 0.10
    insert_relief_search_force_ratio: 0.50
    insert_relief_search_speed_ratio: 0.50
    insert_relief_backoff_step_m: 0.0001
    insert_max_relief_retreat_m: 0.0003
    insert_relief_stationary_speed_m_s: 0.0005
    insert_relief_stationary_angular_speed_rad_s: 0.01
    insert_max_relief_cycles: 3
    insert_max_tilt_tolerance_rad: 0.0523598776
    insert_max_seated_depth_tolerance_m: 0.003
    insert_max_settle_time_sec: 1.5
    insert_max_timeout_sec: 60.0
    insert_max_travel_m: 0.05
    insert_start_position_tolerance_m: 0.003
    insert_start_orientation_tolerance_rad: 0.0349065850
    cartesian_reach:
      origin_x_m: 0.0
      origin_y_m: 0.5
      origin_z_m: 1.021
      # Keep a 50 mm coarse margin inside the UR5e's 850 mm nominal reach.
      # The controller's isPoseWithinSafetyLimits check remains authoritative.
      max_xy_radius_m: 0.8
  joint_state_topics:
    - "/joint_states"
  trajectory_topics: []
  hardware_trajectory_action: "/cais_ur5e_rtde_trajectory_controller/follow_joint_trajectory"
  hardware_cartesian_action: "/cais_ur5e_rtde_cartesian_controller/move_cartesian"
  hardware_insert_action: "/cais_ur5e_rtde_cartesian_controller/move_insert"
  hardware_insertion_demonstration_action: "/cais_ur5e_rtde_cartesian_controller/record_insertion_demonstration"
  hardware_relative_cartesian_action: "/cais_ur5e_rtde_cartesian_controller/move_relative_cartesian"
  hardware_cartesian_jog_service: "/cais_ur5e_rtde_cartesian_controller/set_cartesian_jog"
  gazebo_trajectory_topics:
    - "/ur5e_joint_trajectory_controller/joint_trajectory"
  gripper:
    joint: "ur5e_rg2_finger_width"
    topic: "/ur5e_rg2_gripper_traj_controller/joint_trajectory"
    action: "/ur5e_rg2_gripper_traj_controller/follow_joint_trajectory"
    gazebo_trajectory_topics:
      - "/ur5e_rg2_gripper_traj_controller/joint_trajectory"
    open: 0.11
    close: 0.02
    move_time_sec: 0.35
    settle_sec: 0.05
    feedback_timeout_pad_sec: 1.0
    position_tolerance: 0.01
    backend: "xmlrpc"
    rtde:
      hostname: "192.168.1.172"
      open_width_mm: 70.0
      close_width_mm: 10.0
      open_force: 10.0
      close_force: 40.0
      open_settle_sec: 0.6
      close_settle_sec: 1.0
      method: "script"
      disable_remote_control_check: true
    xmlrpc:
      port: 41414
      path: "/"
      timeout_sec: 3.0

dual_robots:
  moveit:
    launch: "dual_robots_hardware_moveit.launch.py"
    default_velocity_scaling: 0.50
    default_acceleration_scaling: 0.50
  paired_markers:
    velocity_scale: 0.50
    marker_scale: 0.25
    cart_max_step_mm: 30.0
    service_timeout_sec: 8.0
  mirror:
    direction: "hardware -> gazebo"
    point_time_sec: 0.1
    hardware_heartbeat_sec: 1.0
    hardware_stale_sec: 3.0
    gazebo_joint_state_stale_sec: 2.0
    gazebo_convergence_tolerance_rad: 0.01
    gazebo_convergence_timeout_sec: 2.0
    gazebo_republish_period_sec: 0.25
    execution_readiness_recovery_timeout_sec: 5.0
    ur5e_point_time_sec: 0.12
    ur5e_min_publish_period_sec: 0.05
    ur5e_min_joint_delta_rad: 0.0010

digital_twin:
  domains:
    gazebo: 41
    hardware: 42
    hardware_xarm6: 42
    hardware_ur5e: 43
  status_paths:
    ur5e_rtde_trajectory: "/tmp/cais_ur5e_rtde_trajectory_status.json"
    ur5e_rg2_gripper: "/tmp/cais_ur5e_rg2_gripper_status.json"
