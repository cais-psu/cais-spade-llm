map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""
    topic_name: map
    frame_id: world

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.03
      downsample_costmap: false
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 20.0
      use_final_approach_orientation: false
      smoother:
        w_data: 0.4
        w_smooth: 0.1

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.0
    progress_checker_plugin: progress_checker
    goal_checker_plugins: ["precise_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.05
      required_movement_angle: 0.01
      movement_time_allowance: 20.0
    precise_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.06
      yaw_goal_tolerance: 0.05
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: true
      # Keep fine velocity choices near a goal while predicting the full route ahead.
      trajectory_generator_name: "dwb_plugins::LimitedAccelGenerator"
      sim_period: 0.05
      min_vel_x: -1.50
      min_vel_y: -1.50
      max_vel_x: 1.50
      max_vel_y: 1.50
      max_vel_theta: 0.50
      min_speed_xy: 0.0
      max_speed_xy: 1.50
      min_speed_theta: 0.10
      acc_lim_x: 1.50
      acc_lim_y: 1.50
      acc_lim_theta: 1.00
      decel_lim_x: -1.50
      decel_lim_y: -1.50
      decel_lim_theta: -1.00
      # Bound CPU work without coarsening footprint collision checks.
      vx_samples: 7
      vy_samples: 7
      vtheta_samples: 9
      sim_time: 1.2
      linear_granularity: 0.02
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.06
      trans_stopped_velocity: 0.02
      short_circuit_trajectory_evaluation: true
      stateful: true
      # Use KMR's rectangle for collision rejection, including side approaches.
      critics: ["RotateToGoal", "Oscillation", "ObstacleFootprint", "Twirling", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      # Nonzero enables rejection; soft cell costs must not outweigh goal progress.
      ObstacleFootprint.scale: 0.001
      Twirling.scale: 20.0
      # KMP omniMove 400 should strafe along a path while preserving its dock yaw.
      PathAlign.scale: 0.0
      PathAlign.forward_point_distance: 0.10
      GoalAlign.scale: 0.0
      GoalAlign.forward_point_distance: 0.10
      # Score the entire trajectory so an endpoint on the path cannot hide a corner cut.
      PathDist.aggregation_type: "sum"
      PathDist.scale: 4.0
      GoalDist.scale: 18.0
      RotateToGoal.scale: 24.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: world
      robot_base_frame: KMR_base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      footprint: "[[0.595, 0.36], [0.595, -0.36], [-0.595, -0.36], [-0.595, 0.36]]"
      footprint_padding: 0.03
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /KMR/map
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 8.0
        inflation_radius: 0.45
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: world
      robot_base_frame: KMR_base_link
      resolution: 0.05
      track_unknown_space: false
      footprint: "[[0.595, 0.36], [0.595, -0.36], [-0.595, -0.36], [-0.595, 0.36]]"
      footprint_padding: 0.03
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /KMR/map
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # SmacPlanner2D plans a centerline; give KMR's long corners room at M1/M2.
        cost_scaling_factor: 3.0
        inflation_radius: 1.0
      always_send_full_costmap: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: world
    robot_base_frame: KMR_base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.50
    min_rotational_vel: 0.05
    rotational_acc_lim: 1.00

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: world
    robot_base_frame: KMR_base_link
    odom_topic: /KMR/odom
    default_nav_to_pose_bt_xml: recovery_framework_navigate_to_pose.xml
