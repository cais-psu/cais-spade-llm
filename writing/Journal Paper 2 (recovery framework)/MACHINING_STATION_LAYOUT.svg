<text x="55" y="695" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#21364f">Nominal flow: Storage → KMR → M1/M2 → ur5e-1/ur5e-2 → Conveyor → Buffer For Machined parts → ur5e-3 → Assembly Station → Exit</text>
<text x="55" y="725" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#52647a">Each peg advances only into an empty zone. Full buffer: stop upstream delivery → use M1/M2 staging nests.</text>
<text x="55" y="750" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#52647a">No removable carriers or collection tray. Part slippage remains ur5e-3 → ur5e-4. KMR Storage-to-M1 is the first execution case.</text>
