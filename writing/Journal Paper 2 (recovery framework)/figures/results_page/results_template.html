<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RCIM Recovery Results</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: one reading column of figure plates, Section 6 subsections then optional; each plate = figure, journal-style caption, short reading note */
:root {
  --bg: #f1f3f5;
  --plate: #ffffff;
  --band: #f6f7f9;
  --ink: #15181d;
  --ink-2: #4b515b;
  --muted: #7c838d;
  --hair: #e1e4e8;
  --axis: #c3c7cd;
  --accent: #2a78d6;
  --accent-soft: #e4eefb;
  --fault: #d03b3b;
  --good: #0ca30c;
  --warn: #fab219;
  --nominal-fill: #eceef1;
  --nominal-stroke: #b1b6be;
  --s1: #00a651;
  --s2: #d95926;
  --s3: #e8b32e;
  --s4: #b03a2e;
  --s5: #f2a7c6;
  --on-s4: #ffffff;
  --dnf: #c4c7cc;
  --on-seg: #15181d;
  --v-openai: #008300;
  --v-claude: #6250d6;
  --m1: rgb(80% 0% 0%);
  --m2: rgb(0% 20% 80%);
  --m3: rgb(0% 55% 0%);
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --font-cap: "Source Serif 4", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1114; --plate: #181a1e; --band: #1d2024; --ink: #eceef1; --ink-2: #b8bec7;
    --muted: #858b95; --hair: #2a2e34; --axis: #3d424a; --accent: #3987e5; --accent-soft: #1b2a3f;
    --nominal-fill: #262a30; --nominal-stroke: #4c525b;
    --s1: #00a651; --s2: #d95926; --s3: #e8b32e; --s4: #b03a2e; --s5: #f2a7c6; --dnf: #70757d;
    --v-openai: #1f9a1f; --v-claude: #9085e9;
    --m1: rgb(100% 35% 35%); --m2: rgb(40% 60% 100%); --m3: rgb(25% 80% 25%);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1114; --plate: #181a1e; --band: #1d2024; --ink: #eceef1; --ink-2: #b8bec7;
  --muted: #858b95; --hair: #2a2e34; --axis: #3d424a; --accent: #3987e5; --accent-soft: #1b2a3f;
  --nominal-fill: #262a30; --nominal-stroke: #4c525b;
  --s1: #00a651; --s2: #d95926; --s3: #e8b32e; --s4: #b03a2e; --s5: #f2a7c6; --dnf: #70757d;
  --v-openai: #1f9a1f; --v-claude: #9085e9;
  --m1: rgb(100% 35% 35%); --m2: rgb(40% 60% 100%); --m3: rgb(25% 80% 25%);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 40px 72px;
}
.wrap { max-width: 1120px; margin: 0 auto; display: grid; gap: 28px; }
a { color: inherit; }
a:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.mast { display: grid; gap: 10px; max-width: 760px; }
.eyebrow { margin: 0; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0; font-family: var(--font-cap); font-weight: 600; font-size: clamp(28px, 4vw, 38px); line-height: 1.15; text-wrap: balance; }
.lede { margin: 0; color: var(--ink-2); max-width: 66ch; }
.prov { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.chip { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; padding: 3px 10px; border: 1px solid var(--hair); border-radius: 999px; background: var(--plate); color: var(--ink-2); }
.chip i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.chip .real { background: var(--accent); }
.chip .fake { border: 1.5px dashed var(--muted); }

.guide-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.guide-table td { padding: 7px 10px 7px 0; border-top: 1px solid var(--hair); vertical-align: top; }
.guide-table td:first-child { white-space: nowrap; font-weight: 600; }
.guide-table td:first-child a { text-decoration: none; }
.guide-table td:first-child a:hover { text-decoration: underline; }
.guide-table td:nth-child(2) { white-space: nowrap; font-family: var(--font-mono); font-size: 12.5px; color: var(--ink-2); }
.guide-table td:last-child { color: var(--ink-2); }
.guide-table tr.sec td { border-top: none; padding: 12px 0 4px; font-size: 11.5px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); font-weight: 600; font-family: var(--font-ui); }
.cfg-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 10px 14px; }
.cfg { border: 1px solid var(--hair); border-radius: 8px; padding: 10px 12px; display: grid; gap: 2px; min-width: 0; }
.cfg b { font-size: 14px; }
.cfg span { font-size: 13.5px; color: var(--ink-2); }
.cfg-axis { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

.group { margin: 14px 0 -12px; display: flex; align-items: baseline; gap: 12px; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.group::after { content: ""; flex: 1; border-top: 1px solid var(--axis); transform: translateY(-4px); }

.plate { margin: 0; background: var(--plate); border: 1px solid var(--hair); border-radius: 10px; padding: 22px 22px 20px; display: grid; gap: 16px; min-width: 0; }
.plate-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
.plate-head h3 { margin: 0; font-size: 18px; font-weight: 600; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-size: 11.5px; padding: 2px 8px; border-radius: 4px; background: var(--band); color: var(--ink-2); border: 1px solid var(--hair); }
.tag.real { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
figcaption { font-family: var(--font-cap); font-size: 14.5px; line-height: 1.5; color: var(--ink); max-width: 88ch; }
figcaption b { font-weight: 600; }
figcaption code { font-family: var(--font-mono); font-size: 12.5px; }
.note { font-size: 13.5px; color: var(--ink-2); border-top: 1px solid var(--hair); padding-top: 12px; display: grid; gap: 4px; max-width: 88ch; }
.note strong { color: var(--ink); font-weight: 600; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .cost { color: var(--muted); font-variant-numeric: tabular-nums; }
.sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.sw.box { border: 1.4px solid var(--accent); background: var(--accent-soft); }
.sw.nom { border: 1.4px solid var(--nominal-stroke); background: var(--nominal-fill); }
.sw.flt { border-radius: 50%; background: var(--fault); }
.sw.flag { width: 0; height: 0; border-radius: 0; border-left: 7px solid transparent; border-right: 7px solid transparent; border-bottom: 12px solid var(--warn); }

.panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 18px 26px; }
.panels.three { grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.panel { min-width: 0; display: grid; gap: 4px; align-content: start; }
.panel h4 { margin: 0; font-size: 13.5px; font-weight: 600; }
.panel .sub { font-size: 12px; color: var(--muted); margin-top: -2px; }
.panel svg { width: 100%; height: auto; display: block; overflow: visible; }
.wide-svg { max-width: 720px; }
.wide-svg svg { width: 100%; height: auto; display: block; overflow: visible; }
.wide-svg.narrow { max-width: 600px; }
.aside-line { font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }

.dia-list { display: grid; gap: 22px; }
.dia-card { display: grid; gap: 8px; min-width: 0; }
.dia-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
.dia-top h4 { margin: 0; font-size: 15px; font-weight: 600; }
.meta { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.meta code { font-family: var(--font-mono); font-size: 11.5px; }
.status { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--hair); }
.status svg { width: 12px; height: 12px; }
.dia-scroll { overflow-x: auto; border: 1px solid var(--hair); border-radius: 8px; background: var(--plate); }
.dia-scroll svg { display: block; }
.flags { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; font-size: 13px; color: var(--ink-2); }
.flags li { display: grid; grid-template-columns: 16px auto 1fr; gap: 8px; align-items: baseline; }
.flags .tri { width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 10px solid var(--warn); transform: translateY(1px); }
.flags .x { color: var(--fault); font-weight: 600; font-size: 13px; line-height: 1; }
.flags b { font-weight: 600; color: var(--ink); white-space: nowrap; }

/* SVG text and fills */
.f-ink { fill: var(--ink); } .f-ink2 { fill: var(--ink-2); } .f-muted { fill: var(--muted); } .f-fault { fill: var(--fault); }
.f-band { fill: var(--band); } .f-plate { fill: var(--plate); }
.lane { font: 500 12.5px var(--font-ui); }
.lane-sub { font: 400 10.5px var(--font-ui); }
.hdr { font: 500 10.5px var(--font-ui); fill: var(--muted); letter-spacing: 0.04em; }
.bx1 { font: 500 11.5px var(--font-ui); fill: var(--ink); }
.bx2 { font: 400 10px var(--font-mono); fill: var(--ink-2); }
.nb { font: 500 10.5px var(--font-ui); fill: var(--accent); }
.ax { font: 400 10.5px var(--font-ui); fill: var(--muted); font-variant-numeric: tabular-nums; }
.lbl { font: 500 11.5px var(--font-ui); fill: var(--ink); }
.lbl2 { font: 400 10.5px var(--font-ui); fill: var(--muted); }
.val { font: 500 11px var(--font-ui); fill: var(--ink); font-variant-numeric: tabular-nums; }
.seg { font: 600 10.5px var(--font-ui); fill: var(--on-seg); font-variant-numeric: tabular-nums; }
.grid-line { stroke: var(--hair); stroke-width: 1; }
.base-line { stroke: var(--axis); stroke-width: 1; }
.conn { stroke: var(--muted); stroke-width: 1.2; fill: none; }
.nb-conn { stroke: var(--accent); stroke-width: 1.1; stroke-dasharray: 3 3; fill: none; opacity: 0.8; }
.ev rect.b { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.4; }
.ev.nom rect.b { fill: var(--nominal-fill); stroke: var(--nominal-stroke); }
.ev.nom .bx1 { fill: var(--ink-2); }
.ev:hover rect.b, .ev:focus rect.b { stroke-width: 2.4; }
.ev:focus { outline: none; }
[data-t] { cursor: default; }
.hit:hover { opacity: 0.85; }

.table-wrap { overflow-x: auto; }
table.results { border-collapse: collapse; width: 100%; font-size: 13.5px; font-variant-numeric: tabular-nums; min-width: 760px; }
table.results th, table.results td { padding: 9px 12px; text-align: right; border-bottom: 1px solid var(--hair); white-space: nowrap; }
table.results th:first-child, table.results td:first-child { text-align: left; white-space: normal; }
table.results thead th { font-size: 12px; font-weight: 600; color: var(--ink-2); vertical-align: bottom; border-bottom: 1.5px solid var(--ink); }
table.results thead tr.grp th { text-align: center; border-bottom: 1px solid var(--axis); color: var(--ink); font-size: 12.5px; }
table.results thead th small { display: block; font-weight: 400; color: var(--muted); }
table.results td small { display: block; font-size: 11.5px; color: var(--muted); white-space: normal; }
table.results tbody tr:last-child td { border-bottom: 1.5px solid var(--ink); }
table.results td.na { color: var(--muted); font-style: italic; }
table.results tr.ref td { font-weight: 600; }
table.results .sep { border-left: 1px solid var(--axis); }
table.results.wide { min-width: 960px; }
table.results.text th, table.results.text td { text-align: left; }
table.results.text td { white-space: normal; vertical-align: top; }
table.results.text td:first-child { font-weight: 600; min-width: 130px; }
table.results.kv { min-width: 0; }
table.results.kv td:first-child { width: 26%; }
table.results td code { font-family: var(--font-mono); font-size: 12px; overflow-wrap: anywhere; }
table.results .todo { color: var(--muted); font-style: italic; }
table.results tr.model td { text-align: left; font-weight: 600; color: var(--ink); background: var(--band); }
table.results tr.total td { font-weight: 600; }
.mk { display: inline-block; vertical-align: -1px; margin-right: 6px; }
.points { margin: 0; padding-left: 18px; display: grid; gap: 7px; max-width: 88ch; font-size: 14px; color: var(--ink-2); }
.points b { color: var(--ink); font-weight: 600; }

#tip { position: fixed; z-index: 20; max-width: 320px; pointer-events: none; background: var(--plate); color: var(--ink); border: 1px solid var(--hair); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; line-height: 1.45; box-shadow: 0 6px 24px rgb(0 0 0 / 0.14); }
#tip code { font-family: var(--font-mono); font-size: 11.5px; word-break: break-all; }
#tip .tw { color: var(--ink-2); }

@media (max-width: 560px) {
  .plate { padding: 16px 14px; }
  .guide-table td:nth-child(2) { display: none; }
  .guide-table td:first-child { white-space: normal; width: 42%; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
/* Table 4 in journal form: caption above, horizontal rules only (top, header, bottom), serif text. */
.paper-table { font-family: "Times New Roman", "Nimbus Roman", "Liberation Serif", Georgia, serif; color: var(--ink); display: grid; gap: 8px; }
.paper-cap { margin: 0; font-size: 14.5px; line-height: 1.45; max-width: 92ch; }
.paper-panel { margin: 6px 0 -2px; font-size: 14px; font-style: italic; }
table.paper { width: 100%; border-collapse: collapse; font-size: 14px; line-height: 1.4; }
table.paper th, table.paper td { padding: 4px 10px; text-align: left; vertical-align: top; }
table.paper thead tr:first-child th { border-top: 1.5px solid var(--ink); padding-top: 6px; }
table.paper thead tr:last-child th { border-bottom: 0.75px solid var(--ink); }
table.paper thead th { font-weight: 600; vertical-align: bottom; }
table.paper thead th.span { text-align: center; border-bottom: 0.75px solid var(--ink); }
table.paper tbody tr:first-child td { padding-top: 6px; }
table.paper tbody tr:last-child td { border-bottom: 1.5px solid var(--ink); padding-bottom: 6px; }
table.paper .c { text-align: center; }
table.paper td:first-child { white-space: nowrap; }
.paper-table sup, .paper-table sub { line-height: 0; font-size: 0.72em; }
table.paper small { display: block; font-size: 12.5px; font-weight: 400; color: var(--ink-2); }
table.paper.kv td:first-child { width: 24%; white-space: normal; }
.paper-notes { font-size: 12.5px; line-height: 1.45; display: grid; gap: 2px; }
.paper-notes p { margin: 0; }
details summary { cursor: pointer; font-size: 13.5px; color: var(--ink-2); margin-bottom: 10px; }
</style>
</head>
<body>
<main class="wrap">
  <header class="mast">
    <p class="eyebrow">Journal Paper 2 · Section 6.3 · results</p>
    <h1>RCIM Recovery Results</h1>
    <p class="lede" id="lede"></p>
    <div class="prov" id="prov"></div>
  </header>

  <h2 class="group">6.3 · Experimental setup</h2>

  <figure class="plate" id="tab4">
    <div class="plate-head">
      <h3>Table 4 · Experimental setup</h3>
      <div class="tags"><span class="tag real">from code and records</span><span class="tag">protocol</span></div>
    </div>
    <div class="paper-table">
      <p class="paper-cap" id="tab5-caption"></p>
      <p class="paper-panel">(a) Compared methods</p>
      <div class="table-wrap"><table class="paper" id="tab5a"></table></div>
      <p class="paper-panel">(b) Outline generation</p>
      <div class="table-wrap"><table class="paper kv" id="tab5b"></table></div>
      <p class="paper-panel">(c) Primitive composition</p>
      <div class="table-wrap"><table class="paper kv" id="tab5c"></table></div>
      <div class="paper-notes" id="tab5-notes"></div>
    </div>
    <p class="aside-line" id="tab5-source" style="margin:0"></p>
  </figure>

  <h2 class="group">6.3.1 · Performance results · all three models</h2>

  <figure class="plate" id="fig11">
    <div class="plate-head">
      <h3>Fig. 11 · Audited outcome by setting</h3>
      <div class="tags" data-tags="RC2 · ablation"></div>
    </div>
    <div class="legend" id="fig11-legend"></div>
    <div class="panels" id="fig11-panels"></div>
    <figcaption id="fig11-caption"></figcaption>
  </figure>

  <figure class="plate" id="tab7">
    <div class="plate-head">
      <h3 id="tab7-title">Table 7 · Primitive composition</h3>
      <div class="tags" data-tags="RC1 + RC2"></div>
    </div>
    <p class="paper-panel">(a) By LLM, the four scenarios pooled</p>
    <div class="table-wrap"><table class="results" id="tab7-table"></table></div>
    <p class="paper-panel">(b) By failure scenario, the three LLMs pooled</p>
    <div class="table-wrap"><table class="results" id="tab7b-table"></table></div>
    <figcaption id="tab7-caption"></figcaption>
  </figure>

  <h2 class="group">6.3.2 · Model comparison</h2>

  <figure class="plate" id="fig13">
    <div class="plate-head">
      <h3>Fig. 12 · Model comparison</h3>
      <div class="tags" data-tags="model comparison"></div>
    </div>
    <div class="legend" id="fig13-legend" aria-hidden="true"></div>
    <div class="wide-svg narrow" id="fig13-chart"></div>
    <figcaption id="fig13-caption"></figcaption>
  </figure>

  <h2 class="group">Optional</h2>

  <figure class="plate" id="fig12">
    <div class="plate-head">
      <h3>Fig. O1 · Context retrieval</h3>
      <div class="tags" data-tags="Sec. 5 · 𝒦 · optional"></div>
    </div>
    <p class="paper-panel">(a) Outline generation, per attempt</p>
    <div class="wide-svg" id="fig12-svg"></div>
    <p class="paper-panel">(b) Primitive composition, per composition</p>
    <div class="wide-svg" id="fig12b-svg"></div>
    <figcaption id="fig12-caption"></figcaption>
  </figure>

  <figure class="plate" id="tabo1">
    <div class="plate-head">
      <h3>Table O1 · What validation rejected</h3>
      <div class="tags" data-tags="RC2 · H2 · optional"></div>
    </div>
    <div class="table-wrap"><table class="results" id="tabo1-table"></table></div>
    <figcaption id="tabo1-caption"></figcaption>
  </figure>

  <figure class="plate" id="tabo2">
    <div class="plate-head">
      <h3>Table O2 · What composition rejected</h3>
      <div class="tags" data-tags="RC1 + RC2 · optional"></div>
    </div>
    <div class="table-wrap"><table class="results wide" id="tabo2-table"></table></div>
    <figcaption id="tabo2-caption"></figcaption>
  </figure>

  <figure class="plate" id="tab8">
    <div class="plate-head">
      <h3>Table 8 · Execution in Gazebo</h3>
      <div class="tags" data-tags="optional"></div>
    </div>
    <div class="table-wrap"><table class="results wide" id="tab8-table"></table></div>
    <figcaption id="tab8-caption"></figcaption>
  </figure>

  <h2 class="group">Every attempt</h2>

  <figure class="plate" id="attempts">
    <div class="plate-head">
      <h3>All started attempts</h3>
      <div class="tags" data-tags="audit record"></div>
    </div>
    <div id="attempts-body"></div>
  </figure>
</main>
<div id="tip" role="tooltip" hidden></div>

<script>
const DATA = /*RESULTS_DATA*/null;
const TIPS = [];
const tip = (html) => { TIPS.push(html); return TIPS.length - 1; };
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const pct = (v) => `${Math.round(v * 100)}%`;
const dash = "–";
function wilson(k, n, z = 1.96) {
  if (!n) return [0, 0];
  const z2 = z * z, c = (k + z2 / 2) / (n + z2), h = (z / (n + z2)) * Math.sqrt((k * (n - k)) / n + z2 / 4);
  return [Math.max(0, c - h), Math.min(1, c + h)];
}

const PLACEHOLDER = DATA.mode === "placeholder";
const SETTINGS = DATA.settings;
// Scenario order on the page, as in the paper's Fig. 11: Conveyor and UR5e-1, then Part slippage and M1 (user, 2026-11-12).
const SCENARIO_ORDER = ["Conveyor breakdown", "ur5e-1 breakdown", "Part slippage", "Machining breakdown during part processing"];
const ORDER = [...SCENARIO_ORDER.filter((s) => DATA.scenarios.includes(s)), ...DATA.scenarios.filter((s) => !SCENARIO_ORDER.includes(s))];
const SHORT = DATA.scenario_short;
// The paper's name for each failure scenario (user decision, 2026-11-09). The attempt list keeps the records' names.
const SCENARIO_LABELS = {
  "Conveyor breakdown": "Conveyor breakdown", "ur5e-1 breakdown": "UR5e-1 robot breakdown",
  "Machining breakdown during part processing": "M1 machine breakdown", "Part slippage": "Part slippage",
};
const scenarioLabel = (scn) => SCENARIO_LABELS[scn] ?? scn;
const MODELS = DATA.models;
// Fig. 11, Table 7, Fig. O1 and Table O1 pool the three models' attempts (user decision, 2026-11-08); Fig. 12 compares them.
const POOLED = { id: "all", planned: MODELS.reduce((t, m) => t + m.planned, 0) };
const MODEL_NAMES = `${MODELS.slice(0, -1).map((m) => esc(m.name)).join(", ")} and ${esc(MODELS[MODELS.length - 1].name)}`;
const FW_SINGLE = 4, FW_INCREMENTAL = 5;
// Display order: what the LLM gets, then outline-level above event-level in each group.
const SETTING_GROUPS = [
  { label: "BASELINE: NO RULES, NO CHECKS", rows: [0, 2] },
  { label: "INFORMED BASELINE: RULES IN PROMPT, NO CHECKS", rows: [1, 3] },
  { label: "NEURO-SYMBOLIC FRAMEWORK: RULES HIDDEN, RA + CCA CHECKS", rows: [4, 5] },
];
// One color per audit outcome, in the audit's order, then "not audited".
const CLASS_COLORS = ["var(--s1)", "var(--s2)", "var(--s3)", "var(--s4)", "var(--s5)", "var(--muted)", "var(--dnf)", "var(--band)"];
const CLASSES = DATA.classes.map((label, i) => ({ label, c: CLASS_COLORS[i] }));
const NOT_AUDITED = CLASSES.length - 1;
// Fig. 11 shows unresolved and did_not_finish as one segment under both names, and its caption explains them
// (user decision, 2026-11-08); the records and the attempt list keep each attempt's own outcome.
const JOINED = ["unresolved", "did_not_finish"].map((name) => DATA.classes.indexOf(name));
const JOINED_LABEL = "No outline established";
// Fig. 11's name for each audit outcome, with the check that sets it, as in the paper's figures
// (cais_spade_llm/experimental_results/style.py, OUTCOME_LABELS). The attempt list keeps the audit's names.
const OUTCOME_LABELS = {
  passed: "Passed", infeasible: "Infeasible: symbolic (RA)", physically_unsupported: "Infeasible: physical (RA)",
  unsafe: "Unsafe (CCA)", no_nominal_continuation: "Blocking (CCA)", "not audited": "Not audited",
};
// A count label's color on a segment: white on the dark outcome fills (--on-sN where the page sets one).
const segInk = (color) => (/^var\(--s\d\)$/.test(color) ? color.replace(/^var\(--s(\d)\)$/, "var(--on-s$1, var(--on-seg))") : "var(--on-seg)");
// Fig. 11's segments: each class in the audit's order, the joined pair at the first of the two.
function fig11Segments(classes) {
  return classes.flatMap((k, ci) => {
    if (ci === JOINED[1]) return [];
    if (ci !== JOINED[0]) return [{ k, label: OUTCOME_LABELS[CLASSES[ci].label], color: CLASSES[ci].c, detail: "" }];
    const [a, b] = JOINED.map((i) => classes[i]);
    return [{ k: a + b, label: JOINED_LABEL, color: CLASSES[ci].c,
              detail: `<br>unresolved ${a} · did_not_finish ${b}` }];
  });
}
// Sequential blue ramp in tenths; cell text turns white from 70% up.
const PASS_RAMP = ["#eef4fc", "#dbe8fb", "#cde2fb", "#b7d3f6", "#9ec5f4", "#86b6ef", "#6da7ec", "#3987e5", "#2a78d6", "#256abf", "#1c5cab"];
const cell = (m, s, scn) => DATA.cells[m.id][s][scn];
const settingLabel = (s) => SETTINGS[s].n;
function pooled(m, s) {
  return ORDER.reduce((t, scn) => ({ k: t.k + cell(m, s, scn).classes[0], n: t.n + cell(m, s, scn).n }), { k: 0, n: 0 });
}
const sumOver = (m, s, f) => ORDER.reduce((t, scn) => t + f(cell(m, s, scn)), 0);

// A model's mark: its declared shape (square, circle or diamond); without one, square for Claude, else circle.
function modelMark(m, x, y, r, { stroke = 2, t } = {}) {
  const style = `fill:${m.color};stroke:${m.color};stroke-width:${stroke}`;
  const data = t === undefined ? "" : ` data-t="${t}"`;
  const shape = m.mark || (m.vendor === "Claude" ? "square" : "circle");
  if (shape === "square") {
    return `<rect x="${x - r * 0.9}" y="${y - r * 0.9}" width="${r * 1.8}" height="${r * 1.8}" rx="1.5" style="${style}"${data}/>`;
  }
  if (shape === "diamond") {
    const d = r * 1.2;
    return `<path d="M${x},${y - d} L${x + d},${y} L${x},${y + d} L${x - d},${y} Z" style="${style}"${data}/>`;
  }
  return `<circle cx="${x}" cy="${y}" r="${r}" style="${style}"${data}/>`;
}
// Vertical offset of model i's mark within a row, so every model's mark stays visible.
const markOffset = (i, step) => (i - (MODELS.length - 1) / 2) * step;

  // Each setting name is "<method>, <generation level>".
  const split = (name) => { const k = name.lastIndexOf(", "); return [name.slice(0, k), name.slice(k + 2)]; };
  const methods = [...new Set(C.settings.map((s) => split(s.name)[0]))];
  const levels = [...new Set(C.settings.map((s) => split(s.name)[1]))];

  const methodRows = methods.map((m) => {
    const s = C.settings.find((x) => split(x.name)[0] === m);

    return `<tr><td>${esc(m)}${validated ? " (proposed)" : ""}</td><td>${s.rules_in_prompt ? "In the prompt" : "Not given"}</td><td>${validated ? "RA and CCA" : "None"}</td></tr>`;
  }).join("");

  const specs = [...new Set(C.scenarios.map((r) => r.safety_specifications))];
  // Product names as their makers write them.
  const modelName = (m) => esc(m.name.replace(/ medium$/, "").replace(/^gpt-/, "GPT-"));

  const setup = [
    ["Generation", esc(levels.map((l, i) => (i === 0 ? l.charAt(0).toUpperCase() + l.slice(1) : l)).join(" and "))],
    ["Failure scenarios", C.scenarios.map((r) => esc(r.scenario)).join(", ")],
    ["Safety specifications", specs.length === 1 ? `φ<sub>1</sub>–φ<sub>${specs[0]}</sub> (Table 3)` : `Per scenario: ${specs.join(", ")}`],
    ["LLMs", `${MODELS.map(modelName).join(", ")} (${esc(C.effort)} effort)`],
    ["Attempts", planned.length === 1 ? `${planned[0]} per method, level and scenario, for each LLM`
      : `${MODELS.map((m) => m.planned).join(" and ")} per method, level and scenario, respectively`],
    ["Maximum turns", `${DATA.max_turns} per attempt`],
  ];
  document.getElementById("tab5b").innerHTML = `<thead><tr><th>Parameter</th><th>Value</th></tr></thead><tbody>${setup.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join("")}</tbody>`;

  const study2 = [
    ["Outlines composed", "Passed event-level framework outlines, the 3 shortest per LLM and scenario"],
    ["Composing LLM", `${MODELS.map(modelName).join(", ")} (${esc(C.effort)} effort), each composing only the outlines it generated`],
    ["Composition checks", "Declared primitive effects and motion planning, by each event's RA"],
    ["Maximum turns", `${C.composition_event_turns} per event, ${C.composition_turns} per composition; a run also ends after 6 turns without progress`],
    ["Context", "Lookups kept within an event and cleared between events; the projected state carries over"],
  ];
  document.getElementById("tab5c").innerHTML = `<thead><tr><th>Parameter</th><th>Value</th></tr></thead><tbody>${study2.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join("")}</tbody>`;

  document.getElementById("tab5-caption").innerHTML = `<b>Table 4.</b> Experimental setup: (a) compared methods; (b) outline generation; (c) primitive composition.`;
  document.getElementById("tab5-notes").innerHTML = "";
  document.getElementById("tab5-source").innerHTML = `Read from <code>outline_experiments.CONFIGURATIONS</code>, <code>recovery_case_safety</code> and <code>primitive_composition</code>.`;
}

/* ---------- Fig. 11: audited outcome by setting, all models pooled ---------- */
function renderOutcome() {
  const anyNotAudited = SETTINGS.some((_, s) => sumOver(POOLED, s, (c) => c.classes[NOT_AUDITED]) > 0);
  document.getElementById("fig11-legend").innerHTML = CLASSES
    .map((c, i) => ({ ...c, i, label: i === JOINED[0] ? JOINED_LABEL : OUTCOME_LABELS[c.label] }))
    .filter(({ i }) => i !== JOINED[1] && (i < NOT_AUDITED || anyNotAudited))
    .map((c) => `<span><i class="sw" style="background:${c.c};outline:1px solid var(--hair)"></i>${c.label}</span>`).join("");
  const W = 550, X0 = 246, BW = 200, RH = 34, GH = 18, TOP = 16, EX = X0 + BW + 10;
  const H = TOP + SETTING_GROUPS.length * GH + SETTINGS.length * RH + 20;
  let clipId = 0;
  document.getElementById("fig11-panels").innerHTML = ORDER.map((scn) => {
    const p = [];
    p.push(`<text x="${EX}" y="10" class="lbl2">median effort</text>`);
    [0, 0.5, 1].forEach((q) => {
      const x = X0 + q * BW;
      p.push(`<line x1="${x}" y1="${TOP}" x2="${x}" y2="${H - 22}" class="grid-line"/>`);
      p.push(`<text x="${x}" y="${H - 6}" class="ax" text-anchor="middle">${Math.round(q * 100)}%</text>`);
    });
    let y = TOP;
    SETTING_GROUPS.forEach((g, gi) => {
      if (gi > 0) p.push(`<line x1="0" y1="${y + 2}" x2="${W}" y2="${y + 2}" class="base-line"/>`);
      p.push(`<text x="0" y="${y + 14}" class="hdr">${g.label}</text>`);
      y += GH;
      g.rows.forEach((s) => {
        const c = cell(POOLED, s, scn), bh = RH - 12;
        p.push(`<text x="0" y="${y + 13}" class="lbl">${esc(settingLabel(s))}</text><text x="0" y="${y + 26}" class="lbl2">${esc(SETTINGS[s].d)} · n = ${c.n}</text>`);
        if (!c.n) {
          p.push(`<rect x="${X0}" y="${y + 4}" width="${BW}" height="${bh}" rx="3" style="fill:none;stroke:var(--axis);stroke-dasharray:3 3"/>`);
          p.push(`<text x="${X0 + BW / 2}" y="${y + 4 + bh / 2 + 4}" class="lbl2" text-anchor="middle">no attempts yet</text>`);
          y += RH;
          return;
        }
        const cid = `c11-${clipId++}`;
        p.push(`<clipPath id="${cid}"><rect x="${X0}" y="${y + 4}" width="${BW}" height="${bh}" rx="3"/></clipPath><g clip-path="url(#${cid})">`);
        let x = X0;
        const segments = fig11Segments(c.classes);
        segments.forEach(({ k, label, color, detail }, si) => {
          if (!k) return;
          const w = (k / c.n) * BW, last = segments.slice(si + 1).every((seg) => seg.k === 0);
          const t = tip(`<b>${esc(scenarioLabel(scn))}</b> · ${esc(settingLabel(s))}<br>${label}: <b>${k}/${c.n}</b>${detail}`);
          p.push(`<rect x="${x}" y="${y + 4}" width="${Math.max(0, w - (last ? 0 : 2))}" height="${bh}" style="fill:${color}" class="hit" data-t="${t}"/>`);
          if (k) p.push(`<text x="${x + w / 2 - (last ? 0 : 1)}" y="${y + 4 + bh / 2 + 4}" class="seg" style="fill:${segInk(color)}" text-anchor="middle" pointer-events="none">${k}</text>`);
          x += w;
        });
        p.push("</g>");
        const effort = c.tokens_k === null ? dash : `${c.tokens_k}k`;
        p.push(`<text x="${EX}" y="${y + 13}" class="val">${effort} <tspan class="lbl2">· ${c.minutes === null ? dash : c.minutes} min</tspan></text>`);
        p.push(`<text x="${EX}" y="${y + 26}" class="lbl2">${c.lookups === null ? dash : c.lookups} lookups</text>`);
        y += RH;
      });
    });
    return `<div class="panel"><h4>${esc(scenarioLabel(scn))}</h4><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Audited outcomes by setting for ${esc(scenarioLabel(scn))}, all models pooled">${p.join("")}</svg></div>`;
  }).join("");
  document.getElementById("fig11-caption").innerHTML = `<b>Fig. 11.</b> Audited outcome of each started attempt, by setting and failure scenario, pooled over the three models (${MODEL_NAMES}, all at reasoning effort ${esc(DATA.conditions.effort)}; ${MODELS[0].planned} attempts per model, ${POOLED.planned} per setting and scenario planned, n started shown per row). Bars show the share of started attempts and segment labels give counts; Fig. 12 compares the models. Each attempt has the audit's outcome, set by the first failing check of its first failing event. Each segment names the check that set it: Infeasible: symbolic (RA) is the audit's infeasible (Alg. 1), Infeasible: physical (RA) its physically_unsupported (Eq. 12), Unsafe (CCA) its unsafe (Eq. 13) and Blocking (CCA) its no_nominal_continuation (Eq. 6). The segment ${JOINED_LABEL} joins the two outcomes that leave no established outline: unresolved, a finished outline the audit could not establish (an event leaves out a value it changes, or the search for a nominal continuation ran out), and did_not_finish, an attempt that ended without an outline (the ${DATA.max_turns}-request budget or the stall stop); its tooltip and the attempt list give each attempt's own outcome. It differs from Blocking (CCA), where every event passed and the audit proved that normal production cannot resume. Numbers at the right are the median tokens, generation time and fact lookups per attempt over all models. Settings 2 and 4 show the safety rules in the prompt; the others hide them, and in the framework settings (5 and 6) the CCA holds them. The two framework settings cannot finish an infeasible or unsafe outline, or one with no nominal continuation, by construction.`;
}

/* ---------- Fig. O1 (optional): lookups by reference, all models pooled: (a) outline, setting 6; (b) composition ---------- */
function retrievalPanel(rows, values, counts, unit, svgId, label) {
  // values: one {path: mean} or null per scenario in ORDER; counts: how many attempts or compositions each mean is over.
  const W = 720, X0 = 300, CW = (W - X0) / ORDER.length, RH = 28, TOP = 26;
  const H = TOP + (rows.length + 1) * RH + 8;
  const grid = values.map((byPath) => (byPath ? rows.map((path) => byPath[path] || 0) : null));
  const max = Math.max(1, ...grid.flatMap((v) => v || []));
  const p = [];
  SHORT.forEach((s, j) => p.push(`<text x="${X0 + j * CW + CW / 2}" y="16" class="lbl" text-anchor="middle">${esc(s)}</text>`));
  let y = TOP;
  if (!rows.length) p.push(`<text x="0" y="${y + RH / 2 + 4}" class="lbl2">No lookups recorded yet.</text>`);
  rows.forEach((path, i) => {
    p.push(`<text x="0" y="${y + RH / 2 + 4}" class="lbl2" style="font-family:var(--font-mono)">${esc(path)}</text>`);
    ORDER.forEach((scn, j) => {
      const row = grid[j], x = X0 + j * CW, cx = x + CW / 2, ty = y + RH / 2 + 4;
      if (!row) {
        p.push(`<text x="${cx}" y="${ty}" text-anchor="middle" class="lbl2">${dash}</text>`);
        return;
      }
      const v = row[i], level = v > 0 ? Math.max(1, Math.round((v / max) * 9)) : 0, dark = level >= 7;
      const t = tip(`<b>${esc(scenarioLabel(scn))}</b> · <code>${esc(path)}</code><br><b>${v}</b> lookups per ${unit} (mean of ${counts[j]})`);
      p.push(`<rect x="${x + 1.5}" y="${y + 1.5}" width="${CW - 3}" height="${RH - 3}" rx="3" style="fill:${v > 0 ? PASS_RAMP[level] : "var(--band)"}" data-t="${t}"/>`);
      p.push(v > 0
        ? `<text x="${cx}" y="${ty}" text-anchor="middle" style="font:500 11.5px var(--font-ui);fill:${dark ? "#ffffff" : "#15181d"}" pointer-events="none">${v}</text>`
        : `<text x="${cx}" y="${ty}" text-anchor="middle" class="f-muted" style="font:500 11.5px var(--font-ui)" pointer-events="none">·</text>`);
    });
    y += RH;
  });
  p.push(`<line x1="0" y1="${y + 2}" x2="${W}" y2="${y + 2}" class="base-line"/>`);
  p.push(`<text x="0" y="${y + RH / 2 + 5}" class="lbl">total</text>`);
  grid.forEach((row, j) => p.push(`<text x="${X0 + j * CW + CW / 2}" y="${y + RH / 2 + 5}" class="val" text-anchor="middle">${row ? Math.round(row.reduce((a, c) => a + c, 0) * 10) / 10 : dash}</text>`));
  document.getElementById(svgId).innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${label}">${p.join("")}</svg>`;
}

function renderRetrieval() {
  retrievalPanel(DATA.references, ORDER.map((scn) => cell(POOLED, FW_INCREMENTAL, scn).references),

}

function renderTableO2() {
  const C = DATA.composition, rows = (C && C.refusals) || [];

  const shortName = (m) => m.name.replace(/ medium$/, "");
  if (!rows.length) {
    table.innerHTML = `<tbody><tr><td class="todo">No composition refusals recorded yet.</td></tr></tbody>`;
    document.getElementById("tabo2-caption").innerHTML = `<b>Table O2.</b> Optional. Refusals during primitive composition.`;
    return;
  }
  const total = (r) => Object.values(r.models).reduce((a, b) => a + b, 0);
  const head = `<thead><tr><th>Record code</th><th style="text-align:left">Message as recorded</th>${MODELS.map((m) => `<th>${esc(shortName(m))}</th>`).join("")}<th class="sep">All</th><th>Fixed in the same event</th><th>Event never accepted</th></tr></thead>`;
  let previous = null;
  const body = rows.map((r) => {
    const code = r.code === previous ? "" : `<code>${esc(r.code)}</code>`;
    previous = r.code;
    return `<tr><td>${code}</td><td style="text-align:left;white-space:normal;min-width:320px">${esc(r.message)}</td>${MODELS.map((m) => `<td>${r.models[m.id] || ""}</td>`).join("")}<td class="sep">${total(r)}</td><td>${r.fixed}</td><td>${r.open}</td></tr>`;
  }).join("");
  const sum = (f) => rows.reduce((t, r) => t + f(r), 0);
  const foot = `<tr class="total"><td>All</td><td></td>${MODELS.map((m) => `<td>${sum((r) => r.models[m.id] || 0)}</td>`).join("")}<td class="sep">${sum(total)}</td><td>${sum((r) => r.fixed)}</td><td>${sum((r) => r.open)}</td></tr>`;
  table.innerHTML = head + `<tbody>${body}${foot}</tbody>`;
  const n = C.total ? C.total.composed : 0;
  document.getElementById("tabo2-caption").innerHTML = `<b>Table O2.</b> Optional. Refusals while composing primitive programs for the ${n} outlines of Table 7, by LLM (${MODEL_NAMES}). Each row is one refusal message as the composition record gives it, with step indices, numbers, poses and quoted values left out so that equal refusals count together, under the record's code: <code>composition_infeasible</code>, the checks refused the program (its primitive contracts, the recorded facts, or motion planning in the cell recorded at the failure); <code>composition_missing_context</code>, the program reads a value the checks could not resolve, or one that differs from what the owner's calculation reads; <code>primitive_revision_requested</code>, the composing LLM proposed no program and reported that no visible primitive could perform the event. Fixed in the same event counts refusals after which a later program for that event was accepted, so they cost turns but not the outcome; Event never accepted counts those in the event where a composition stopped. A composition that stopped after six turns without progress is counted by those turns' refusals.`;
}

      <th>${swatch("physically_unsupported")}${OUTCOME_LABELS.physically_unsupported}<small>Eq. 12</small></th>
      <th>${swatch("unsafe")}${OUTCOME_LABELS.unsafe}<small>Eq. 13, after passing RA</small></th>
      <th>${swatch("no_nominal_continuation")}${OUTCOME_LABELS.no_nominal_continuation}<small>Eq. 6</small></th></tr></thead>`;
  const row = (c, redo = true) => {
    if (!c.n || !c.rejections) return `<td class="na">${dash}</td>`.repeat(6);
    const r = c.rejections;
    return `<td>${c.completed}/${c.n}</td><td>${redo ? (c.redo ?? dash) : ""}</td><td class="sep">${r.ra}</td><td>${r.physical}</td><td>${r.cca}</td><td>${r.eq6}</td>`;
  };
  const total = (s) => {
    const cs = ORDER.map((scn) => cell(POOLED, s, scn)).filter((c) => c.n && c.rejections);
    const add = (f) => cs.reduce((t, c) => t + f(c), 0);
    return { n: add((c) => c.n), completed: add((c) => c.completed), rejections: {
      ra: add((c) => c.rejections.ra), physical: add((c) => c.rejections.physical), cca: add((c) => c.rejections.cca), eq6: add((c) => c.rejections.eq6) } };
  };
  const body = [FW_SINGLE, FW_INCREMENTAL].map((s) =>
    `<tr class="model"><td colspan="7">${esc(settingLabel(s))} <span style="font-weight:400;color:var(--muted)">· ${esc(SETTINGS[s].d)}</span></td></tr>`
    + ORDER.map((scn) => `<tr><td>${esc(scenarioLabel(scn))}</td>${row(cell(POOLED, s, scn))}</tr>`).join("")
    + `<tr class="total"><td>All four scenarios</td>${row(total(s), false)}</tr>`).join("");
  document.getElementById("tabo1-table").innerHTML = head + `<tbody>${body}</tbody>`;
  document.getElementById("tabo1-caption").innerHTML = `<b>Table O1.</b> Optional. Rejections in the two framework settings, pooled over the three models (${MODEL_NAMES}) and summed over the started attempts per scenario. Each rejection column uses the name and colour that Fig. 11 gives the outcome its check sets, but counts rejections, not attempts: one attempt can be rejected many times before it passes. In ${esc(SETTINGS[FW_SINGLE].n)} a rejection stops a whole outline at its first failing event, and the LLM rewrites the outline; in ${esc(SETTINGS[FW_INCREMENTAL].n)} a rejection applies to one proposed event, which the LLM revises. RA runs before CCA safety, so every Unsafe (CCA) rejection is a proposal that passed RA: a feasible but unsafe event (H2). Completed counts the attempts that finished an outline within ${DATA.max_turns} turns.`;
}

    byModel = C7.models
      ? MODELS.map((m) => (C7.models[m.id] ? row(nameOf(m), C7.models[m.id]) : todo(nameOf(m)))).join("") + total

  document.getElementById("tab7-table").innerHTML = head("LLM (medium effort)") + `<tbody>${byModel}</tbody>`;
  document.getElementById("tab7b-table").innerHTML = head("Failure scenario") + `<tbody>${byScenario}</tbody>`;
  document.getElementById("tab7-caption").innerHTML = `<b>Table 7.</b> Primitive composition of ${esc(SETTINGS[FW_INCREMENTAL].n)} outlines: (a) by LLM, pooled over the four failure scenarios (12 outlines per LLM); (b) by failure scenario, pooled over the three LLMs (${MODEL_NAMES}; 9 outlines per scenario); 36 in all. The All row is the same in both. For each LLM and scenario, the three accepted outlines with the fewest events (ties: the earliest run; they include the outlines executed in Gazebo, Table 8) were composed by the LLM that wrote them, at reasoning effort ${esc(DATA.conditions.effort)}. Composed: Outlines is the share of outlines in which every event received a primitive program that the composition checks accepted, which each event's RA runs on its own program: the primitives' declared effects, and motion planning in the cell recorded at the failure. Events is the mean share of an outline's events that received one, so that each outline counts once; events are composed in order, so a composition that stops leaves the rest of its outline uncomposed. It was added after the compositions ran, beside the planned measure. Median per outline: the number of events in the outline, and the tokens and time spent composing the whole outline (the composition stage only), over all composed outlines, including those that stopped early. Every composed outline had already been accepted by RA and CCA; the CCA does not check the programs again. Each outline was composed once, with two exceptions, for which the table reports the later attempt, whatever it gave: GPT-6.1 Sol composed its Part slippage outlines twice; and GPT-6.1 Terra's three Machining outlines, the only outlines with a Conveyor event, were composed again after the Conveyor's primitives were served with the descriptions and outputs that the first compositions lacked, a gap found in the audit after the runs. Lookups during composition are in Fig. O1 (b). The outline stage is in Fig. 11 and Table O1.`;
}

/* ---------- Fig. 12: every model ---------- */
// Fig. 12 draws each model in its own color, none of which Fig. 11 uses, and names each check in words only, with no
// outcome color beside it (user decisions, 2026-11-09).
const CHECKS = [
  { label: OUTCOME_LABELS.infeasible, key: "ra" },
  { label: OUTCOME_LABELS.physically_unsupported, key: "physical" },
  { label: OUTCOME_LABELS.unsafe, key: "cca" },
];
// A model's checked candidate events in setting 6, and how many and what share of them each check rejected.
function eventRejections(m) {
  const cs = ORDER.map((scn) => cell(m, FW_INCREMENTAL, scn)).filter((c) => c.n && c.rejections && c.proposals);
  const checked = cs.reduce((t, c) => t + c.proposals, 0);
  const counts = CHECKS.map((k) => cs.reduce((t, c) => t + c.rejections[k.key], 0));
  const values = counts.map((k) => (checked ? k / checked : null));
  return { checked, counts, values, rounded: checked ? roundedParts(values) : null };
}
// Whole percentages for shares that add up to a total: the total rounds as usual and the parts take the largest
// remainders, so the printed parts add up to the printed total.
function roundedParts(values) {
  const total = Math.round(values.reduce((a, c) => a + c, 0) * 100);
  const parts = values.map((v) => Math.floor(v * 100 + 1e-9));
  const order = values.map((_, i) => i).sort((a, b) => (values[b] * 100 - parts[b]) - (values[a] * 100 - parts[a]));
  const missing = total - parts.reduce((a, c) => a + c, 0);
  for (let k = 0; k < missing; k++) parts[order[k]] += 1;
  return { parts, total };
}
function renderComparison() {
  document.getElementById("fig13-legend").innerHTML = MODELS.map((m) => `<span><svg width="14" height="14">${modelMark(m, 7, 7, 5)}</svg>${esc(m.name)} (${esc(m.role)})</span>`).join("");
  const X0 = 280, X1 = 490, cols = MODELS.map((_, i) => 506 + i * 48), W = 506 + MODELS.length * 48;
  const xs = (q) => X0 + q * (X1 - X0);
  const TOP = 22, GH = 22, RH = 26, RR = 24;
  const bottom = TOP + SETTING_GROUPS.length * GH + SETTINGS.length * RH;
  const shares = MODELS.map((m) => eventRejections(m));
  // Rejection scale in 10% steps, so the gridlines fall on round shares.
  const MAX = Math.max(0.1, Math.ceil(Math.max(0, ...shares.flatMap((s) => s.values.filter((v) => v !== null))) / 0.1) * 0.1);
  const xr = (v) => X0 + (v / MAX) * (X1 - X0);
  const rTop = bottom + 46, rBottom = rTop + CHECKS.length * RR, H = rBottom + 40;
  const p = [];
  const columnMarks = (y) => MODELS.forEach((m, i) => p.push(modelMark(m, cols[i] + 8, y, 4.5)));

  p.push(`<text x="0" y="12" class="hdr">OUTLINES PASSED · ALL FOUR SCENARIOS POOLED</text>`);
  columnMarks(8);
  [0, 0.25, 0.5, 0.75, 1].forEach((q) => {
    p.push(`<line x1="${xs(q)}" y1="${TOP}" x2="${xs(q)}" y2="${bottom}" class="${q === 0 ? "base-line" : "grid-line"}"/>`);
    p.push(`<text x="${xs(q)}" y="${bottom + 14}" class="ax" text-anchor="middle">${pct(q)}</text>`);
  });
  let y = TOP;
  SETTING_GROUPS.forEach((g) => {
    p.push(`<text x="0" y="${y + 15}" class="hdr">${g.label}</text>`);
    y += GH;
    g.rows.forEach((s) => {
      const cy = y + RH / 2;
      p.push(`<text x="0" y="${cy + 4}" class="lbl">${esc(settingLabel(s))}</text>`);
      // Grey bar: every model's attempts in this setting pooled.
      const all = MODELS.reduce((t, m) => ({ k: t.k + pooled(m, s).k, n: t.n + pooled(m, s).n }), { k: 0, n: 0 });
      if (all.n) {
        const [alo, ahi] = wilson(all.k, all.n);
        const at = tip(`<b>All models pooled</b> · ${esc(settingLabel(s))}<br>passed <b>${all.k}/${all.n}</b> (${pct(all.k / all.n)})<br><span class="tw">95% CI ${pct(alo)}–${pct(ahi)}</span>`);
        p.push(`<rect x="${xs(0)}" y="${cy - RH / 2 + 3}" width="${Math.max(0, xs(all.k / all.n) - xs(0))}" height="${RH - 6}" style="fill:var(--ink-2);opacity:0.12" data-t="${at}"/>`);
      }
      MODELS.forEach((m, mi) => {
        const { k, n } = pooled(m, s), my = cy + markOffset(mi, 7);
        if (!n) {
          p.push(`<text x="${cols[mi]}" y="${cy + 4}" class="lbl2">${dash}</text>`);
          return;
        }
        const q = k / n, [lo, hi] = wilson(k, n);
        const t = tip(`<b>${esc(m.name)}</b> (${esc(m.role)}) · ${esc(settingLabel(s))}<br>passed <b>${k}/${n}</b> (${pct(q)})<br><span class="tw">95% CI ${pct(lo)}–${pct(hi)}</span>`);
        p.push(`<path d="M${xs(lo)},${my - 3} V${my + 3} M${xs(lo)},${my} H${xs(hi)} M${xs(hi)},${my - 3} V${my + 3}" style="stroke:${m.color};stroke-width:1.4;fill:none;opacity:0.55"/>`);
        p.push(modelMark(m, xs(q), my, 4.5, { t }));
        p.push(`<text x="${cols[mi]}" y="${cy + 4}" class="val">${pct(q)}</text>`);
      });
      y += RH;
    });
  });

  p.push(`<text x="0" y="${rTop - 12}" class="hdr">CHECKED EVENTS REJECTED · ${esc(SETTINGS[FW_INCREMENTAL].n.toUpperCase())}</text>`);
  columnMarks(rTop - 16);
  [0, MAX / 2, MAX].forEach((v, k) => {
    p.push(`<line x1="${xr(v)}" y1="${rTop}" x2="${xr(v)}" y2="${rBottom}" class="${k === 0 ? "base-line" : "grid-line"}"/>`);
    p.push(`<text x="${xr(v)}" y="${rBottom + 14}" class="ax" text-anchor="middle">${pct(v)}</text>`);
  });
  y = rTop;
  CHECKS.forEach((check, j) => {
    const cy = y + RR / 2;
    p.push(`<text x="0" y="${cy + 4}" style="font:400 11px var(--font-ui);fill:var(--ink-2)">${esc(check.label)}</text>`);
    p.push(`<line x1="${X0}" y1="${cy}" x2="${X1}" y2="${cy}" class="grid-line"/>`);
    MODELS.forEach((m, i) => {
      const v = shares[i].values[j];
      if (v === null) {
        p.push(`<text x="${cols[i]}" y="${cy + 4}" class="lbl2">${dash}</text>`);
        return;
      }
      const t = tip(`<b>${esc(m.name)}</b> · ${esc(check.label)}<br><b>${(v * 100).toFixed(1)}%</b>: ${shares[i].counts[j]} of ${shares[i].checked} checked events rejected`);
      p.push(modelMark(m, xr(v), cy + markOffset(i, 6), 4.5, { t }));
      p.push(`<text x="${cols[i]}" y="${cy + 4}" class="val">${shares[i].rounded.parts[j]}%</text>`);
    });
    y += RR;
  });
  p.push(`<text x="0" y="${rBottom + 30}" class="lbl" style="font-weight:600">All checks</text>`);
  MODELS.forEach((m, i) => {
    const r = shares[i].rounded;
    p.push(`<text x="${cols[i]}" y="${rBottom + 30}" class="val" style="font-weight:600">${r === null ? dash : `${r.total}%`}</text>`);
  });
  document.getElementById("fig13-chart").innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Share of attempts passed per setting and ${esc(SETTINGS[FW_INCREMENTAL].n)} rejections by check, per model">${p.join("")}</svg>`;
  const shapes = { square: "squares", circle: "circles", diamond: "diamonds" };
  const named = MODELS.map((m) => `${esc(m.name)} (${shapes[m.mark || (m.vendor === "Claude" ? "square" : "circle")]})`);
  document.getElementById("fig13-caption").innerHTML = `<b>Fig. 12.</b> ${["No", "One", "Two", "Three", "Four", "Five"][MODELS.length] || MODELS.length} models: ${named.slice(0, -1).join(", ")} and ${named[named.length - 1]}, all at reasoning effort ${esc(DATA.conditions.effort)} and ${MODELS[0].planned} attempts per model, setting and scenario. The figure shows whether the framework's effect holds across models, not which model is better: the models differ in vendor, size and release date. The prompt was first developed on gpt-5.4 (frozen on 21 Oct 2026), and later code fixes were tried on Claude Opus 5.5. Top: share of started attempts passed in each setting, pooled over the four scenarios, with 95% Wilson intervals per model; the grey bar pools every model's attempts, as Fig. 11 does. Bottom: share of each model's checked candidate events that each check rejected in ${esc(SETTINGS[FW_INCREMENTAL].n)}, named as in Fig. 11. Blocking (CCA), the Eq. 6 check, is not drawn: it runs once per outline, when the LLM declares the outline complete, not on each candidate event. Each model has its own color and shape, and Fig. 11 uses none of these colors. In each model's column of the bottom panel, the percentages are rounded so that the three checks add up to All checks; each event is rejected by at most one check. A provider refusal counts as a failed attempt; no automatic fallback to another model is used.`;
}

/* ---------- Tooltip ---------- */
const tipEl = document.getElementById("tip");
function showTip(el, x, y) {
  const i = el.getAttribute("data-t");
  if (i === null) return;
  tipEl.innerHTML = TIPS[+i];
  tipEl.hidden = false;
  const r = tipEl.getBoundingClientRect();
  let left = x + 14, top = y + 14;
  if (left + r.width > window.innerWidth - 8) left = x - r.width - 14;
  if (top + r.height > window.innerHeight - 8) top = y - r.height - 14;
  tipEl.style.left = Math.max(8, left) + "px";
  tipEl.style.top = Math.max(8, top) + "px";
}
document.addEventListener("pointermove", (e) => {
  const el = e.target.closest ? e.target.closest("[data-t]") : null;
  if (el) showTip(el, e.clientX, e.clientY); else tipEl.hidden = true;
});
document.addEventListener("pointerdown", (e) => {
  const el = e.target.closest ? e.target.closest("[data-t]") : null;
  if (el) showTip(el, e.clientX, e.clientY); else tipEl.hidden = true;
});
window.addEventListener("scroll", () => { tipEl.hidden = true; }, { passive: true });

renderHeader();
renderConditions();
renderOutcome();
renderTableO1();
renderTableO2();
renderRetrieval();
renderTable7();
renderTable8();
