[tool.poetry]
name = "cais-spade-llm"
version = "0.1.0"
description = ""
authors = ["Jonghan Lim <jxl567@psu.edu>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.11"
spade = "^4.1.2"
spade-llm = "^0.2.0"
langchain = "^0.2.11"
langchain-community = "^0.2.10"
langchain-openai = "^0.1.14"
pdfplumber = "^0.11.2"
chroma = "^0.2.0"
chromadb = "^0.5.5"
ltlf2dfa = "^1.0.2"
python-dotenv = "^1.2.1"
graphviz = "^0.21"
pytest = "^9.0.2"
scipy = "^1.14.1"
ur-rtde = "^1.6.0"
inference-sdk = "0.37.1"
numpy = ">=1.26,<2"
opencv-contrib-python-headless = "4.10.0.84"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    ".venv",
    "ros2/third_party",
]

[tool.ruff.lint]
# Enforced rule families. E/F are the pycodestyle+pyflakes baseline; the rest
# target the specific debt this repo accumulated from agent-authored code.
select = [
    "E",       # pycodestyle errors
    "F",       # pyflakes
    "I",       # import sorting (isort)
    "UP",      # pyupgrade — modernize syntax for the py310 target
    "B",       # flake8-bugbear — likely bugs and footguns
    "SIM",     # flake8-simplify — redundant/overcomplicated constructs
    "T20",     # flake8-print — no print(); CLAUDE.md mandates logging
    "BLE",     # flake8-blind-except — no bare `except Exception`
    "C901",    # mccabe — function too complex
    "PLR0912", # too many branches
    "PLR0913", # too many arguments
    "PLR0915", # too many statements
]
ignore = [
    "E501",    # line length — the formatter handles wrapping; not worth failing on
    "E402",    # module-import-not-at-top — this repo REQUIRES lazy ROS2 imports
    "F821",    # undefined-name — false-positives on this repo's nested UI closures
]

# Package __init__ files legitimately re-export names.
# ros2/ scripts are CLI-style tools where stdout print is the interface;
# the no-print rule targets the runtime package (use logging there).
[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"ros2/**" = ["T20"]

# Generous thresholds so the complexity rules flag only egregious cases now,
# not merely-large functions. Tighten these as the monster files get decomposed.
[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 20
max-statements = 80

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
# ros2/ launch files and scripts are runtime contracts for the installed workspace.
# Lint them, never auto-format them.
exclude = ["ros2/**"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.14,<0.15)",
    "pre-commit (>=4.6.0,<5.0.0)"
]
